<!DOCTYPE html>
<html lang="de">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein persönlicher Pokédex</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap Bundle mit Popper -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="app.js"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-danger text-white text-center py-4 shadow-sm">
        <div class="container">
            <h1 class="display-4 fw-bold">⚡ Mein Pokédex - Gen 1 ⚡</h1>
            <p class="lead mb-0">Erstelle und speichere dein eigenes Kanto-Team</p>
        </div>
    </header>

    <main class="container my-5 flex-grow-1">

        <!-- Formular -->
        <section class="row justify-content-center mb-5" aria-labelledby="search-heading">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 id="search-heading" class="h4 mb-3 text-secondary text-center">Pokémon hinzufügen</h2>

                        <form id="pokemon-form" class="row g-3 align-items-end">
                            <!-- Input text -->
                            <div class="col-sm-5">
                                <label for="pokemon-input" class="form-label fw-semibold">Name oder ID (1-151)</label>
                                <input type="text" id="pokemon-input" class="form-control"
                                    placeholder="Z.B. Pikachu oder 25">
                            </div>
                            <div class="col-sm-2 text-center my-auto fw-bold text-muted d-none d-sm-block">
                            </div>
                            <!-- Dropdown-Menu -->
                            <div class="col-sm-5">
                                <label for="pokemon-select" class="form-label fw-semibold">Finde dein Pokémon in dieser
                                    Liste</label>
                                <select id="pokemon-select" class="form-select">
                                    <option value="">-- Suchen --</option>
                                </select>
                            </div>
                            <div class="col-12 mt-4 text-center">
                                <button type="button" id="btn-add" class="btn btn-primary px-5 fw-bold">Fangen!</button>
                                <button type="button" id="btn-clear" class="btn btn-outline-danger ms-2">Pokédex
                                    leeren</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </section>

        <hr class="my-5">
        <section aria-labelledby="pokedex-heading">
            <h2 id="pokedex-heading" class="text-center mb-4 text-dark fw-bold">Meine Sammlung</h2>
            <div id="empty-message" class="text-center text-muted my-5">
                <p class="fs-5">Dein Pokédex ist zurzeit noch leer. Fange oben dein erstes Pokémon!</p>
            </div>
            <!-- row =display flex + flex-wrap ; puis nb de colonne selon la taille de l'écran -->
            <div id="pokemon-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            </div>
        </section>

    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 - Pokédex Projekt - Daten bereitgestellt durch PokéAPI</small>
        </div>
    </footer>
</body>

</html>
